<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Zone - แหล่งรวมอุปกรณ์ไอทีสุดล้ำ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><i class="fas fa-laptop-code"></i> IT HUB</a>
            <ul class="nav-links">
                <li><a href="#" class="active">หน้าแรก</a></li>
                <li><a href="#">รีวิว</a></li>
                <li><a href="#">บทความ</a></li>
                <li><a href="#">ติดต่อเรา</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>อัปเดตเทรนด์ <span class="highlight">อุปกรณ์ไอที</span> รีวิวชัดเจนก่อนใคร</h1>
            <p>รวมทุกอุปกรณ์ Gadget, PC, Gaming Gear และ Accessories ที่คุณต้องมีในปี 2026</p>
            <a href="#explore" class="btn">สำรวจอุปกรณ์ทั้งหมด</a>
        </div>
    </header>

    <main class="container" id="explore">
        
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
            <button class="filter-btn" data-filter="pc">PC & Laptop</button>
            <button class="filter-btn" data-filter="gaming">Gaming Gear</button>
            <button class="filter-btn" data-filter="gadget">Smart Gadgets</button>
        </div>

        <section class="gadget-grid" id="gadget-grid">
            </section>
    </main>

    <footer>
        <p>&copy; 2026 IT HUB Site. All rights reserved. Create with ❤️ by Gemini</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
